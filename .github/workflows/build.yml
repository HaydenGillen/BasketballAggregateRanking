# Put this file at .github/workflows/build.yml in a repo that also contains rank_blend.py.
# Run it from the repo's Actions tab ("Run workflow"), then download the two builds from the run page.
name: Build Rank Blend

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: rank-blend-windows
          - os: macos-latest   # Apple Silicon Macs. Intel Macs need a separate Intel runner.
            name: rank-blend-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name ${{ matrix.name }} --exclude-module playwright rank_blend.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
