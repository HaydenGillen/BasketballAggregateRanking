# Put this file at .github/workflows/run.yml in a repo that also contains rank_blend.py.
# It runs the script and commits the finished page to docs/index.html in the same repo.
# To serve it as a web page: Settings > Pages > Deploy from a branch > main, folder /docs.
name: Run Rank Blend

on:
  workflow_dispatch:        # the "Run workflow" button on the Actions tab
  schedule:
    - cron: "0 11 * * *"    # every day at 11:00 UTC (6 AM US Eastern). Delete these two lines to run only by hand.

permissions:
  contents: write           # lets the job push the commit

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the rankings page
        env:
          # Optional. Only needed if KenPom asks for a login. Add them under
          # Settings > Secrets and variables > Actions. Leave them out otherwise.
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
        run: |
          mkdir -p docs
          python rank_blend.py --no-open --out docs/index.html

      - name: Commit the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update rankings"
          git push
